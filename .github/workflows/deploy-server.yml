name: Deploy Server
on:
  push:
    branches: [main]
    # web-v* only — android-v* (release-android.yml) is a separate release
    # train, so tagging one never triggers the other's job.
    tags: ['web-v*']

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: server/package-lock.json }
      # See ci.yml: ubuntu-latest (24.04) restricts unprivileged user namespaces,
      # which workerd needs — without this, `npm test` hangs instead of failing.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
        working-directory: server
      # server/public/ (deployed as this Worker's static assets, and what
      # npm test below serves /, /magic, etc. from) is web/'s build merged
      # with server/public-static/.
      - run: sh scripts/build-web-public.sh
      - run: npm test
        working-directory: server
        timeout-minutes: 3
      - name: Deploy to dielys-dev
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: server
          environment: dev
      - name: Record deploy SHA
        run: echo "Deployed ${{ github.sha }} to dielys-dev" >> "$GITHUB_STEP_SUMMARY"

  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/web-v')
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: server/package-lock.json }
      # See ci.yml: ubuntu-latest (24.04) restricts unprivileged user namespaces,
      # which workerd needs — without this, `npm test` hangs instead of failing.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
        working-directory: server
      # See deploy-dev above: server/public/ is web/'s build merged with
      # server/public-static/, and what gets deployed as static assets.
      - run: sh scripts/build-web-public.sh
      - run: npm test
        working-directory: server
        timeout-minutes: 3
      - name: Deploy to dielys-prod
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: server
          environment: prod
      - name: Record deploy SHA
        run: echo "Deployed ${{ github.ref_name }} (${{ github.sha }}) to dielys-prod" >> "$GITHUB_STEP_SUMMARY"
