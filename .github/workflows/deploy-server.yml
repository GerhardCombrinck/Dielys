name: Deploy Server
on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: server/package-lock.json }
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
      - name: Deploy to wonderlys-dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: server
          environment: dev
      - name: Record deploy SHA
        run: echo "Deployed ${{ github.sha }} to wonderlys-dev" >> "$GITHUB_STEP_SUMMARY"

  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: server/package-lock.json }
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
      - name: Deploy to wonderlys-prod
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: server
          environment: prod
      - name: Record deploy SHA
        run: echo "Deployed ${{ github.ref_name }} (${{ github.sha }}) to wonderlys-prod" >> "$GITHUB_STEP_SUMMARY"
