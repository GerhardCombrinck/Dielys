name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: protocol/package-lock.json }
      - run: npm ci
        working-directory: protocol
      - run: npx biome ci .
        working-directory: protocol
      - run: npx tsc --noEmit
        working-directory: protocol
      - run: sh scripts/node-tests.sh protocol
        env: { DIELYS_TEST_TIMEOUT: '150' }

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: server/package-lock.json }
      # ubuntu-latest (24.04) restricts unprivileged user namespaces by default,
      # which is what workerd needs for its sandbox. Without this, `npm test`
      # (vitest-pool-workers, which spawns workerd) hangs indefinitely instead
      # of failing outright — no error, just no progress until the job times out.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
        working-directory: server
      - run: npx biome ci .
        working-directory: server
      - run: npx tsc --noEmit
        working-directory: server
      # Two different hangs meet here, and neither prints anything. workerd's
      # sandbox can hang on ubuntu-latest when the sysctl above did not take,
      # and the test pool sometimes starts a workerd it never stops
      # (cloudflare/workers-sdk#15498), leaving a suite where every test passed
      # waiting forever. node-tests.sh bounds each attempt and retries; the job
      # cap is the backstop for anything that outlives even that. Local runs go
      # through the same script, via scripts/verify.sh.
      - run: sh scripts/node-tests.sh server
        # The local default is 45s, sized for this machine. A cold two-core
        # runner is not this machine, and a false timeout here reads as a red
        # build for a suite that passed, so give it room: three attempts at
        # 150s, and a job cap above that as the backstop.
        env: { DIELYS_TEST_TIMEOUT: '150' }
        timeout-minutes: 10

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: 'temurin', java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew ktlintCheck detekt testDebugUnitTest
        working-directory: android
