name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: protocol/package-lock.json }
      - run: npm ci
        working-directory: protocol
      - run: npx biome ci .
        working-directory: protocol
      - run: npx tsc --noEmit
        working-directory: protocol
      - run: npm test
        working-directory: protocol

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: server/package-lock.json }
      # ubuntu-latest (24.04) restricts unprivileged user namespaces by default,
      # which is what workerd needs for its sandbox. Without this, `npm test`
      # (vitest-pool-workers, which spawns workerd) hangs indefinitely instead
      # of failing outright — no error, just no progress until the job times out.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
        working-directory: server
      - run: npx biome ci .
        working-directory: server
      - run: npx tsc --noEmit
        working-directory: server
      # Local run is ~8s. The sysctl above usually prevents workerd's sandbox
      # from hanging on ubuntu-latest, but not always (seen once in three
      # attempts) — this bounds the damage to minutes instead of the job's
      # full timeout when it recurs.
      - run: npm test
        working-directory: server
        timeout-minutes: 3

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: 'temurin', java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew ktlintCheck detekt testDebugUnitTest
        working-directory: android
