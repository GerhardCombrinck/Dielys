name: Release Android
on:
  push:
    # android-v* only — web-v* (deploy-server.yml) is a separate release
    # train, so tagging one never triggers the other's job.
    tags: ['android-v*']

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    environment: prod
    # The repo default token is read-only; creating the Release and uploading
    # the APK needs write access to contents.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: 'temurin', java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      # Without this file the build still succeeds but has no FirebaseApp, so
      # the released app never registers for push (android/AGENTS.md). Fine
      # for a local build, not for one going to Play — so a blank secret stops
      # the release here rather than shipping an app that quietly can't be woken.
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 is not set on the prod environment"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      # The APK is for sideloading from the GitHub Release; Play only accepts
      # the bundle. Same versionCode for both, so they are the same build.
      - name: Build signed release APK and bundle
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease -PversionCode=${{ github.run_number }}

      - name: Remove keystore and Firebase config
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" android/app/google-services.json

      # The R8 mapping file, so a crash stack trace from a release build can be
      # retraced back to real names and line numbers (issue #70). Play Console
      # has its own "Deobfuscation files" upload per release — this same file
      # still needs uploading there by hand alongside the .aab, since there is
      # no automated Play publish step in this repo (see android/AGENTS.md).
      - name: Attach APK, bundle, and mapping file to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/mapping/release/mapping.txt
