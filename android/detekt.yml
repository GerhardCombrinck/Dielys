build:
  maxIssues: 0

# A @Composable is declarative markup, not procedure: its parameters are the
# state it is given and the events it sends back, and its length is the shape of
# what it draws. Counting either the way you would count a function that computes
# something produces the wrong answer, and the fix it pushes for — bundling
# unrelated callbacks into a holder, or splitting a layout mid-tree — makes the
# code worse. These three counters are waived for Composables and for nothing else.
complexity:
  LongMethod:
    threshold: 60
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreAnnotated: ['Composable']
  LargeClass:
    threshold: 300
  # `Position` is a line-for-line port of `server/src/domain/position.ts`. The two
  # have to produce identical keys from identical inputs (F4), and the way that
  # guarantee breaks is one of them being restructured to satisfy a counter.
  CyclomaticComplexMethod:
    threshold: 20
  # `DielysRepository` is the whole surface the UI is allowed to call, one function
  # per user action. Splitting it by count would put related writes in different
  # files without making any of them simpler.
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 20
    thresholdInObjects: 20

style:
  ForbiddenComment:
    active: false
  # A colour literal assigned to a named property is already the named constant
  # this rule asks for; detekt just cannot see through the `Color(...)` call.
  MagicNumber:
    ignorePropertyDeclaration: true
  # Guard clauses. The ported fractional-index functions return early because the
  # reference implementation does, and the HTTP mapping reads as a table.
  ReturnCount:
    max: 5
  # `validate` throws a different message per way a key can be malformed. One
  # throw with a joined message would be worse to debug.
  ThrowsCount:
    max: 4
  # Four is the size of a fixture list in the reorder tests, and naming the four
  # is clearer than four indexed reads.
  DestructuringDeclarationWithTooManyEntries:
    maxDestructuringEntries: 4

performance:
  # `Room.databaseBuilder(...).addMigrations(vararg Migration)`. There is no
  # non-spread call, and the array is four entries at most.
  SpreadOperator:
    active: false

comments:
  active: false

naming:
  # `TaskRow`, not `taskRow`. A Composable that emits UI is named for the thing it
  # emits — the convention throughout Compose and androidx itself.
  FunctionNaming:
    ignoreAnnotated: ['Composable']
